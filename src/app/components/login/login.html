<div class="login-container">
    <div class="login-card">
        <h2>Control de Vehiculos</h2>
        <h3>Iniciar Sesión</h3>

        <form id="login-form">
            <div class="form-group">
                <label for="idUsuario">Usuario:</label>
                <input type="text" name="txtUsuario" id="idUsuario" required placeholder="Ingrese su usuario">
            </div>
            <div class="form-group">
                <label for="idClave">Clave:</label>
                <input type="password" id="idClave" name="txtClave" required placeholder="Ingrese su Clave" autocomplete="">
            </div>

            <button type="submit" class="btn btn-primary-block">Ingresar</button>
        </form>

    </div>
</div>
